name: Build and Release Morphe Patches

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Android Build Tools and Platform
        run: |
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "${ANDROID_HOME}/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          fi
          if [ -z "$SDKMANAGER" ] || [ ! -x "$SDKMANAGER" ]; then
            echo "Error: sdkmanager not found under ANDROID_HOME=${ANDROID_HOME}" >&2
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "build-tools;34.0.0" "platforms;android-34"

      - name: Build MPP Patch Bundle
        env:
          KEY_SECRET: ${{ secrets.MORPHE_PRIVATE_KEY }}
        run: |
          if [ -n "$KEY_SECRET" ]; then
            export MORPHE_PRIVATE_KEY="$KEY_SECRET"
          fi
          python3 build_patch.py
          test -s return-youtube-username.mpp

      - name: Determine Version
        id: get_version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          VER="${TAG#v}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

      - name: Update patches-bundle.json
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          TAG: ${{ steps.get_version.outputs.tag }}
          VER: ${{ steps.get_version.outputs.version }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import datetime, json, os

          tag = os.environ["TAG"]
          ver = os.environ["VER"]
          repo = os.environ["REPO"]

          with open("patches-bundle.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if data.get("version") != ver:
              data["version"] = ver
              data["download_url"] = f"https://github.com/{repo}/releases/download/{tag}/return-youtube-username.mpp"
              data["created_at"] = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%S")
              with open("patches-bundle.json", "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, ensure_ascii=False)
                  f.write("\n")
              print(f"Updated patches-bundle.json to version {ver} (preserving existing description).")
          else:
              print(f"patches-bundle.json already matches version {ver}; skipping update.")
          PY
          if ! git diff --quiet patches-bundle.json; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add patches-bundle.json
            git commit -m "chore: update patches-bundle.json for $TAG"
            git push origin HEAD:main || true
          fi

      - name: Upload Release Asset
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.get_version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" return-youtube-username.mpp --clobber
          else
            gh release create "$TAG" return-youtube-username.mpp --title "Return YouTube Username+ $TAG" --generate-notes
          fi
